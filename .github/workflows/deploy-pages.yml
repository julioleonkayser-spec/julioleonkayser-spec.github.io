name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy concurrente; no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OJO: enablement solo ACTIVA Pages si no lo estaba; no reconvierte una
      # configuración legacy existente. Este repo se creó como user site y nació
      # con build_type=legacy (source = rama main), así que servía la raíz del
      # repo -- sin index.html -- y devolvía 404 pese a que el workflow pasaba.
      # Se corrigió una vez con:
      #   gh api -X PUT /repos/{owner}/{repo}/pages -f build_type=workflow
      # Queda persistido en el repo; esto solo cubre un Pages aún sin crear.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # GitHub Pages ignora rutas que empiezan por _ salvo que exista .nojekyll,
      # y Next emite todos sus assets bajo _next/.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
